[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-auto-ws"
version = "0.0.0"
authors = [
    {name = "Maifee Ul Asad", email = "maifeeulasad@gmail.com"},
]
description = "Automatically turn Flask route generators into WebSocket streams."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0",
    "flask-socketio>=5.0",
    "python-engineio>=4.0",
    "python-socketio>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]